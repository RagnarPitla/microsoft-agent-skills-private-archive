name: link-rot

# Documentation URLs rot silently. A skill that confidently sends a reader to a
# 404 does more damage than a missing skill, so the whole index is re-checked on
# a schedule and a failure opens an issue rather than waiting to be noticed.
#
# Every action here is pinned to a commit SHA rather than a tag. This job holds
# `issues: write`, and a tag is mutable: whoever controls the tag controls what
# runs with that permission.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Check every cited URL
        id: links
        run: node scripts/validate-repo.mjs --links 2>&1 | tee link-report.txt

      # Same schedule, same reasoning: star counts and archive flags go stale
      # without anyone touching a file, so they are maintenance rather than a
      # contributor's problem. Runs even when the link step failed, because the
      # two rot independently and one should not mask the other.
      - name: Check the registry is still accurate
        if: always()
        run: node scripts/refresh-stars.mjs --check 2>&1 | tee -a link-report.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Same reasoning again, applied to the skills themselves. A skill states
      # current product behaviour and carries the date it was last checked; that
      # claim goes stale on Microsoft's schedule, not on ours. Surfaced here as a
      # to-do rather than discovered by a reader hitting a retired CLI flag.
      - name: Check no skill is overdue for re-verification
        if: always()
        run: node scripts/validate-repo.mjs --stale 2>&1 | tee -a link-report.txt

      - name: Open an issue if anything rotted
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require("fs");
            let report = "";
            try {
              report = fs.readFileSync("link-report.txt", "utf8");
            } catch {
              report = "No report captured; see the workflow log.";
            }
            const title = "Maintenance: link rot, stale repository facts, or overdue skills";
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "link-rot",
            });
            const body = [
              "The weekly maintenance check failed - a cited URL rotted, a registry repository was renamed, archived or drifted, or a skill is overdue for re-verification. Each entry names the file it came from.",
              "",
              "```",
              report.trim().slice(0, 55000),
              "```",
              "",
              "Fix by correcting the URL, or - if no verified replacement exists - removing the link and saying so.",
              "For an overdue skill, re-read it against current documentation and correct what has changed before moving its verified_on date. Bumping the date without re-reading it turns an honest unknown into a false assurance.",
              "Do not substitute a plausible-looking URL: roughly one in three guessed documentation paths is a 404.",
            ].join("\n");

            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["link-rot"],
              });
            }
