name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The scrub gate, harness staleness check and repo validation all run
      # without dependencies on purpose, so this needs no install step. If that
      # ever stops being true, the pre-commit hook has already broken on a
      # fresh clone and the fix belongs there, not here.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Validate repository
        run: npm run check

      # Deliberately separate from `check`. Link rot is not the contributor's
      # fault and should never block their pull request - it is caught on a
      # schedule instead, where it becomes maintenance rather than a blocker.
      - name: Check links (informational)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: node scripts/validate-repo.mjs --links
