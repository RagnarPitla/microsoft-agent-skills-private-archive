name: freshness

# Verified as resolving on and Review by dates in ## Sources sections and the
# registries' verified_on stamps are the human half of accuracy: a link can
# still resolve while the claim beside it goes stale. See .agents/freshness.md
# for the convention and the default review window. This runs on the same
# weekly cadence as link-rot and opens an issue rather than waiting for a
# reader to notice.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check every dated claim is within its review window
        run: |
          set -o pipefail
          node scripts/check-freshness.mjs 2>&1 | tee freshness-report.txt

      - name: Open an issue if anything is overdue for review
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            let report = "";
            try {
              report = fs.readFileSync("freshness-report.txt", "utf8");
            } catch {
              report = "No report captured; see the workflow log.";
            }
            const title = "Freshness: claims are past their review date";
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "freshness",
            });
            const body = [
              "The weekly freshness check failed - a skill, docs page or registry has a `Verified as resolving on` (or `verified_on`) date past its review window. Each entry names the file.",
              "",
              "```",
              report.trim().slice(0, 55000),
              "```",
              "",
              "Re-open the linked sources, confirm the claim still holds, and bump the date (see .agents/freshness.md).",
              "Do not bump the date without re-reading the page - that defeats the point of the check.",
            ].join("\n");

            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["freshness"],
              });
            }
